services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configura MSSQL_SA_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - tareas-sql:/var/opt/mssql
  tareas-api:
    build: backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: ${TAREAS_COMPOSE_CONNECTION:?Configura TAREAS_COMPOSE_CONNECTION}
    ports:
      - '8080:8080'
  tareas-web:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - '8081:8080'
volumes:
  tareas-sql:
